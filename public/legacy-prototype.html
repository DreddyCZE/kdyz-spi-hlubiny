<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Když spí hlubiny</title><style>
:root{--bg:#101a20;--panel:#1d2b32;--ink:#f0e9da;--gold:#d3ad6c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#30424a,#0e171c 70%);color:var(--ink);font:16px/1.5 Georgia,serif}main{max-width:1150px;margin:auto;padding:22px}h1{margin:0;color:#e5c88f;letter-spacing:3px}h2{margin:0 0 12px;color:var(--gold)}p{margin:10px 0}.muted{color:#a9b9bb;font-size:14px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stat{padding:6px 10px;border:1px solid #53616a;border-radius:30px;background:#26363e}.layout{display:grid;grid-template-columns:265px 1fr;gap:17px}.panel{background:linear-gradient(140deg,#22313a,#18242a);border:1px solid #455760;border-radius:12px;padding:16px;margin-bottom:15px}.places{display:grid;gap:7px}button{cursor:pointer;font:inherit;background:#2d4149;color:#f0e9da;border:1px solid #64737b;border-radius:8px;padding:10px 12px}button:hover:not(:disabled){border-color:#dfbc80}button:disabled{opacity:.45;cursor:default}.places button{text-align:left}.places button.active{background:#5b4c35;border-color:#d3ad6c}.card{background:#e8e0ce;color:#2b2e2c;padding:25px;border:8px double #a79b80;border-radius:12px;box-shadow:0 15px 40px #0008}.card h2{font-size:28px;color:#35352f}.tag{font:700 12px Arial;letter-spacing:2px;color:#77623d}.story{font-size:18px;line-height:1.6}.choice{width:100%;display:block;text-align:left;margin:8px 0;background:#f8f1df;color:#242b2c;border:1px solid #b9aa8a}.choice.active{outline:2px solid #aa7b35}.choices{background:#d8cebb;padding:14px;border-radius:9px}.outcomes{display:grid;gap:7px;margin:15px 0}.outcome{background:#d5cbb9;padding:10px;border-radius:6px}.outcome b{display:block;font:700 11px Arial;letter-spacing:1px;color:#655337}.outcome span{display:block}.blur{filter:blur(6px);user-select:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.primary{background:#795c32;border-color:#b99558}.dicebox{display:none;text-align:center;background:#15232a;color:#fff;border-radius:10px;padding:18px}.dicebox.show{display:block}.die{display:inline-flex;width:70px;height:70px;margin:10px;align-items:center;justify-content:center;background:#f7f0de;color:#19252b;border-radius:13px;font:700 36px Arial;box-shadow:0 7px #9e9687}.die.rolling{animation:shake .12s infinite alternate}@keyframes shake{to{transform:rotate(20deg) translateY(-8px)}}.reveal{display:none;text-align:left;padding:14px;background:#29433c;border:1px solid #91b89e;border-radius:8px;margin-top:12px;animation:appear .7s}.reveal.show{display:block}@keyframes appear{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}.log{max-height:175px;overflow:auto;font-size:13px;color:#b8c4c3}.log p{border-bottom:1px solid #3b4b51;padding-bottom:6px}.hero{padding:17px;background:#1b2c32;border:1px solid #455760;border-radius:10px;margin-bottom:13px}.hero h2{margin:0}.inventory{font-size:14px}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:10px}.card{padding:15px}.story{font-size:16px}}
</style></head><body><main><header class="top"><div><h1>KDYŽ SPÍ HLUBINY</h1><div class="muted">Světlo z hlubin · hratelný karetní prototyp 0.3</div></div><div class="stats"><span class="stat">Kolo <b id="round"></b>/7</span><span class="stat">Hrozba <b id="threat"></b>/10</span><span class="stat">Rituál <b id="ritual"></b>/8</span><span class="stat">AP <b id="ap"></b>/3</span></div></header><div class="layout"><aside><section class="panel"><h2>Lokace</h2><div class="places" id="places"></div><p class="muted">Přesun do jiné lokace stojí 1 AP.</p></section><section class="panel"><h2>Vyšetřovatel</h2><div id="heroStats"></div><div class="actions"><button id="endRound">Další kolo</button><button id="reset">Nová hra</button></div></section><section class="panel"><h2>Deník</h2><div class="log" id="log"></div></section></aside><div><div class="hero"><h2 id="placeTitle"></h2><div class="muted" id="placeDesc"></div></div><section class="card"><div class="tag" id="cardTag"></div><h2 id="cardTitle"></h2><p class="story" id="cardStory"></p><div class="choices"><b id="challenge"></b><div class="muted" style="color:#625c50">Vyber postup. Obtížnost je známá, následky zůstávají skryté.</div><div id="choices"></div></div><div class="outcomes" id="outcomes"></div><div class="actions"><button class="primary" id="roll">🎲 Hodit kostkami</button><button id="next">Další karta</button></div><div class="dicebox" id="dicebox"><div>HOD KOSTKAMI</div><div><span class="die" id="die1">?</span><span class="die" id="die2">?</span></div><div id="sum"></div><div class="reveal" id="reveal"></div></div></section><section class="panel" style="margin-top:15px"><h2>Inventář a důkazy</h2><div class="inventory" id="inventory"></div></section></div></div></main><script>
"use strict";
const locations=[
["Přístav","Opuštěná mola mizí v mlze.",[
["Ztracená loď","Mezi zpuchřelými moly naráží do kůlů malá rybářská loď. Její jméno někdo přeškrtl. Z podpalubí se ozývá škrábání.",8,[["Opatrně prozkoumat podpalubí","VN"],["Vstoupit bez váhání","VŮ"]],["Najdeš deník, mosazný přívěsek a značku vedoucí k majáku.","Najdeš deník zmizelého rybáře.","Získáš útržek deníku, ale něco tě spatří. Ztrácíš 1 SAN.","Podpalubí zůstane neprozkoumané. Ztrácíš 1 SAN.","Něco tě strhne na mokré schody. Ztrácíš 2 HP a 1 SAN."],["Deník a přívěsek","Deník","Útržek deníku","",""]],
["Muž z mlhy","Z mlhy vystupuje rybář z fotografie pohřešovaných. Jeho oči jsou zakalené a na krku má podivné znaky.",9,[["Promluvit s ním","VŮ"],["Nenápadně ho sledovat","VN"]],["Prozradí heslo kultu a svěří ti stříbrný prsten.","Dozvíš se, že rybáři odpluli k majáku.","Získáš svědectví, ale jeho hlas ti zůstane v hlavě. Ztrácíš 1 SAN.","Muž uteče do mlhy.","Muž vykřikne neznámé jméno. Ztrácíš 2 SAN a Hrozba +1."],["Heslo kultu a prsten","Svědectví rybáře","Svědectví rybáře","",""]]
]],
["Staré město","Zavřené obchody a zazděná okna.",[["Obálka pod prahem","Na konci ulice stojí dům, jehož okna někdo zazdil zevnitř. Pod prahem leží obálka s tvým jménem.",7,[["Prohlédnout obálku","VN"],["Vypáčit dveře","SÍ"]],["Získáš plán podzemní chodby a klíč.","Získáš plán podzemní chodby.","Získáš plán, ale ztrácíš 1 HP.","Obálka je prázdná.","Z domu se ozve tvůj hlas. Ztrácíš 2 SAN."],["Plán a klíč","Plán","Plán","",""]]]],
["Knihovna","Archiv ukrývá zakázané záznamy.",[["Zakázaný katalog","Knihovník zmizel. V katalogu někdo označil svazek, který podle záznamů nikdy neexistoval.",8,[["Studovat katalog","VĚ"],["Vyslechnout hlídače","VŮ"]],["Odhalíš původ symbolů a získáš zakázanou knihu.","Najdeš plán majáku.","Získáš část informace, ale ztrácíš 1 SAN.","Záznamy nedávají smysl.","Přečteš větu, kterou nelze zapomenout. Ztrácíš 2 SAN."],["Zakázaná kniha","Plán majáku","Útržek z katalogu","",""]]]],
["Ústav","Za okny se pohybují neklidné postavy.",[["Pokoj číslo 6","Pacient svírá mokré lodní lano. Opakuje, že pod majákem někdo zvoní na zvon bez srdce.",8,[["Uklidnit pacienta","VŮ"],["Prozkoumat záznamy","VĚ"]],["Získáš fotografii kultistů a odhalíš tajný vstup.","Získáš svědectví o nočním zvonění.","Pacient promluví, ale ztrácíš 1 SAN.","Pacient se uzavře do sebe.","Pacient zaútočí. Ztrácíš 1 HP a 1 SAN."],["Fotografie kultistů","Svědectví pacienta","Svědectví pacienta","",""]]]],
["Hřbitov","Mokré náhrobky a rozrytá hlína.",[["Hrob bez jména","Na dně otevřeného hrobu leží kámen s rytinou, která se mění, když odvrátíš zrak.",9,[["Překreslit symbol","VĚ"],["Dotknout se kamene","VŮ"]],["Rozluštíš rituál a získáš starobylý artefakt.","Získáš důkaz o rituálu.","Pochopíš část symbolu, ale ztrácíš 1 SAN.","Rytina zmizí. Ztrácíš 1 SAN.","Z hrobu se ozve klepání. Ztrácíš 2 SAN a Hrozba +1."],["Artefakt","Rytina rituálu","Rytina rituálu","",""]]]],
["Maják","Světlo se otáčí, přestože je odpojené.",[["Schodiště pod světlem","Pod vrstvou soli nacházíš servisní dvířka. Zespodu proudí teplý vzduch a ozývá se zvonění.",9,[["Vypáčit dvířka","SÍ"],["Prozkoumat zámek","VN"]],["Otevřeš průchod a nalezneš kultovní pečeť.","Najdeš mechanismus tajného vstupu.","Dvířka povolí, ale Hrozba +1.","Vstup zůstane zavřený. Ztrácíš 1 HP.","Zvonění zesílí. Ztrácíš 2 SAN a Rituál +1."],["Kultovní pečeť","Tajný vstup","Tajný vstup","",""]]]],
["Jeskyně","Příliv odhaluje cestu do černé skály.",[["Dech podzemního moře","Voda v jezírku stoupá proti gravitaci. Na kameni leží kovový předmět vydávající slabé světlo.",10,[["Přeskočit na kámen","OB"],["Vylovit předmět lanem","VN"]],["Získáš artefakt a poznáš způsob uzavření brány.","Vylovíš zvláštní kovový klíč.","Získáš předmět, ale ztrácíš 1 HP.","Předmět zmizí pod hladinou.","Z vody se vynoří chapadlo. Ztrácíš 2 HP a Hrozba +1."],["Artefakt hlubiny","Kovový klíč","Kovový klíč","",""]]]]
];
const $=id=>document.getElementById(id),stats={SÍ:1,OB:2,VĚ:3,VŮ:2,VN:2};
let s,rolling=false;
function newState(){return {place:0,round:1,ap:3,threat:2,ritual:1,hp:6,san:8,inventory:[],indices:{},choice:0,done:false,ended:false}}
function card(){const pool=locations[s.place][2];return pool[(s.indices[s.place]||0)%pool.length]}
function save(){try{localStorage.setItem("hlubiny-v03",JSON.stringify(s))}catch(e){}}
function log(t){const p=document.createElement("p");p.textContent=t;$("log").prepend(p)}
function update(){for(const k of ["round","threat","ritual","ap"])$(k).textContent=s[k];$("heroStats").innerHTML=`Eleanor Whitmore · Výzkumnice<br>HP: ${s.hp}/6 · SAN: ${s.san}/8<br>SÍ ${stats.SÍ} · OB ${stats.OB} · VĚ ${stats.VĚ} · VŮ ${stats.VŮ} · VN ${stats.VN}`;$("inventory").textContent=s.inventory.join(" · ")||"Zatím nic.";$("placeTitle").textContent=locations[s.place][0];$("placeDesc").textContent=locations[s.place][1];$("places").innerHTML="";
locations.forEach((loc,i)=>{const b=document.createElement("button");b.textContent=loc[0]+(i===s.place?" · zde":"");b.className=i===s.place?"active":"";b.disabled=s.ended||rolling;b.onclick=()=>{if(i===s.place)return;if(s.ap<1){log("Nemáš dost akčních bodů.");return}s.ap--;s.place=i;s.choice=0;s.done=false;draw();log("Přesun: "+loc[0]);save()};$("places").append(b)});
$("roll").disabled=s.done||s.ap<1||s.ended||rolling;$("next").disabled=!s.done||s.ended||rolling;$("endRound").disabled=s.ended||rolling}
function draw(){const c=card();$("cardTag").textContent="PRŮZKUM · "+locations[s.place][0].toUpperCase();$("cardTitle").textContent=c[0];$("cardStory").textContent=c[1];$("challenge").textContent="Výzva · obtížnost "+c[2];$("choices").innerHTML="";
c[3].forEach((choice,i)=>{const b=document.createElement("button");b.className="choice"+(s.choice===i?" active":"");b.textContent=choice[0]+" · "+choice[1];b.disabled=s.done;b.onclick=()=>{s.choice=i;draw();save()};$("choices").append(b)});
$("outcomes").innerHTML="";["Velký úspěch","Úspěch","Částečný úspěch","Neúspěch","Kritické selhání"].forEach((label,i)=>{const d=document.createElement("div");d.className="outcome";const strong=document.createElement("b");strong.textContent=label;const span=document.createElement("span");span.className="blur";span.textContent=c[4][i];d.append(strong,span);$("outcomes").append(d)});
$("dicebox").classList.remove("show");$("reveal").classList.remove("show");$("die1").textContent="?";$("die2").textContent="?";update()}
function evaluate(a,b){const c=card(),attr=c[3][s.choice][1],total=a+b+stats[attr],delta=total-c[2];const index=a===1&&b===1?4:a===6&&b===6?0:delta>=3?0:delta>=0?1:delta>=-2?2:3;const labels=["VELKÝ ÚSPĚCH","ÚSPĚCH","ČÁSTEČNÝ ÚSPĚCH","NEÚSPĚCH","KRITICKÉ SELHÁNÍ"];const txt=c[4][index];$("sum").textContent=`${a} + ${b} + ${stats[attr]} (${attr}) = ${total} proti obtížnosti ${c[2]}`;$("reveal").textContent=labels[index]+" — "+txt;$("reveal").classList.add("show");[...$("outcomes").children].forEach((d,i)=>{if(i!==index)d.style.display="none";else d.querySelector("span").classList.remove("blur")});
if(index<=2&&c[5][index])s.inventory.push(c[5][index]);const san=txt.match(/Ztrácíš (\d+) SAN/i),hp=txt.match(/Ztrácíš (\d+) HP/i);if(san)s.san-=Number(san[1]);if(hp)s.hp-=Number(hp[1]);if(txt.includes("Hrozba +1"))s.threat++;if(txt.includes("Rituál +1"))s.ritual++;
s.done=true;rolling=false;log(c[0]+": "+labels[index].toLowerCase());if(s.hp<=0||s.san<=0||s.threat>=10||s.ritual>=8){s.ended=true;log("Konec scénáře: temnota zvítězila.");$("reveal").textContent+=" KONEC SCÉNÁŘE."}update();save()}
$("roll").onclick=()=>{if(rolling||s.done||s.ap<1||s.ended)return;s.ap--;rolling=true;update();$("dicebox").classList.add("show");const d1=$("die1"),d2=$("die2");d1.classList.add("rolling");d2.classList.add("rolling");let t=0;const timer=setInterval(()=>{d1.textContent=1+Math.floor(Math.random()*6);d2.textContent=1+Math.floor(Math.random()*6);if(++t===16){clearInterval(timer);d1.classList.remove("rolling");d2.classList.remove("rolling");const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);d1.textContent=a;d2.textContent=b;evaluate(a,b)}},85)};
$("next").onclick=()=>{if(!s.done||rolling)return;s.indices[s.place]=(s.indices[s.place]||0)+1;s.choice=0;s.done=false;draw();log("Dobrána další karta.");save()};
$("endRound").onclick=()=>{if(s.ended||rolling)return;s.round++;s.ap=3;s.ritual++;s.done=false;if(s.round>7||s.ritual>=8){s.ended=true;log("Rituál byl dokončen. Konec scénáře.")}else log("Nové kolo. Rituál postupuje.");draw();save()};
$("reset").onclick=()=>{if(!confirm("Opravdu začít novou hru?"))return;s=newState();$("log").innerHTML="";draw();log("Nová hra začíná.");save()};
try{const old=JSON.parse(localStorage.getItem("hlubiny-v03"));s=old&&typeof old.place==="number"&&old.indices?old:newState()}catch(e){s=newState()}draw();log("Vyšetřování začíná. Rozhodni, co uděláš.");
</script></body></html>
