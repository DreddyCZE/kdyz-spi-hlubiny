name: Test and deploy Pages
on:
  push:
    branches: [main, feature/m4-blackwater-scenario-design]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Publishers keep one shared lock; PR tests never publish and cancel outdated runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('blackwater-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/playwright.mjs install --with-deps chromium
      - name: Build and test in Chromium
        run: npm run test:e2e
      - name: Prepare standalone Blackwater V3 build for PR playtesting
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/blackwater-v3') }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/blackwater-v3') }}
        with:
          name: blackwater-v3-playable
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackwater-v3-screenshots
          path: test-results/blackwater-v3-*.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  bundle:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/m4-blackwater-scenario-design')
    needs: test-build
    uses: ./.github/workflows/blackwater-preview.yml
    permissions:
      contents: read
  deploy:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
